<!-- 
    - #HEADER
  -->

  <header class="header" data-header>
      <div class="container">
  
        <a routerLink="/home" class="logo" aria-label="Ayanish Kanudawala home">
          <app-logo />
        </a>
  
        <nav class="navbar" id="primary-navigation" data-navbar [ngClass]="status ? 'active' : ''">
          <ul class="navbar-list">
  
            <li class="navbar-item">
              <a routerLink="/home" class="label-lg navbar-link has-after" routerLinkActive="active">Home</a>
            </li>
  
            <li class="navbar-item">
              <a routerLink="/work" (click)="status = false" class="label-lg navbar-link has-after" routerLinkActive="active">Work</a>
            </li>

            <li class="navbar-item">
              <a routerLink="/skills" (click)="status = false" class="label-lg navbar-link has-after" routerLinkActive="active">Skills</a>
            </li>

            <!-- Hidden at desktop widths (>=992px) where the "Contact Now" button already covers this — kept for mobile, where that button is hidden and the nav is the only way to reach Contact. -->
            <li class="navbar-item navbar-item-contact">
              <a routerLink="/contact" (click)="status = false" class="label-lg navbar-link has-after" routerLinkActive="active">Contact</a>
            </li>

          </ul>
        </nav>
  
        <a routerLink="/contact" class="btn btn-primary">Contact Now</a>
  
        <button class="nav-toggle-btn" aria-label="Toggle navigation" [attr.aria-expanded]="status" aria-controls="primary-navigation" data-nav-toggler (click)="addToggle()">
          <app-icon name="menu" />
        </button>
  
      </div>
    </header>
